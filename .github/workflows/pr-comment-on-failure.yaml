name: Comment on PR if tests fail

on:
  pull_request:
    branches: [python-app]
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        id: run_tests
        run: |
          pytest --tb=short --junitxml=test-results.xml || echo "TESTS_FAILED=true" >> $GITHUB_ENV

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

      - name: Comment on PR if tests failed
        if: env.TESTS_FAILED == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "## ❌ CI Tests Failed\n\nТесты не прошли успешно.\n\n**Commit:** " + context.sha.substring(0, 7) + "\n**Branch:** " + context.payload.pull_request.head.ref
            });
